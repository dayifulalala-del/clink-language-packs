name: Publish compact Clink Chinese Wanxiang (v5)

on:
  workflow_dispatch:
    inputs:
      max_readings:
        description: "Chinese readings kept (lower it if Clink still crashes)"
        required: true
        default: "150000"
      max_latin:
        description: "English / brand readings kept"
        required: true
        default: "12000"
      target_rank:
        description: "Keep only rows that reach the N most frequent words; 0 = no such filter"
        required: true
        default: "0"
      max_clex_words:
        description: "CLEX word cap (independent of CIME; official zh ships ~30k)"
        required: true
        default: "40000"
  push:
    branches: [main]
    paths:
      - "tools/compact_zh_pack.py"
      - "source/zh-cuoyin-extra.tsv"
      - ".github/zh-v5-release-notes.md"
      - ".github/workflows/build-zh-wanxiang-v5-compact.yml"

permissions:
  contents: write

concurrency:
  group: clink-zh-wanxiang-v5-compact
  cancel-in-progress: true

jobs:
  publish-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      KNOWN_GOOD_TAG: vzh-wanxiang-v3-31-1
      KNOWN_GOOD_CIME_SHA256: 458939043be0338059deae8c1e7448df414978c2fa7d805e5f3d0bbaec3c7827
      KNOWN_GOOD_CLEX_SHA256: 9259b3e09704dfdae0a4e6be617c8373c0af487de4da7ae682cf2cd7920e4e5b
      MAX_READINGS: ${{ inputs.max_readings || '150000' }}
      MAX_LATIN: ${{ inputs.max_latin || '12000' }}
      TARGET_RANK: ${{ inputs.target_rank || '0' }}
      MAX_CLEX_WORDS: ${{ inputs.max_clex_words || '40000' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set lexically sortable release version
        run: |
          # v5 sorts after every v3/v4 tag, so an installed pack always sees an update.
          printf -v run "%06d" "$GITHUB_RUN_NUMBER"
          echo "VERSION=vzh-wanxiang-v5-z${run}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Download known-good v3-31-1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _known_good
          mkdir -p _known_good
          gh release download "$KNOWN_GOOD_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'zh--zh.cime' \
            --pattern 'zh--zh.clex' \
            --pattern 'wanxiang-source.json' \
            --dir _known_good
          echo "$KNOWN_GOOD_CIME_SHA256  _known_good/zh--zh.cime" | sha256sum -c -
          echo "$KNOWN_GOOD_CLEX_SHA256  _known_good/zh--zh.clex" | sha256sum -c -

      - name: Download Wanxiang Chinese correction table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _wanxiang
          mkdir -p _wanxiang
          gh release download dict-nightly \
            --repo amzxyz/rime-wanxiang \
            --pattern base-dicts.zip \
            --dir _wanxiang
          # cuoyin is Wanxiang's only correction table (wrong readings / characters);
          # duoyin is ordinary vocabulary there. v3-31-1 used cuoyin 05b423d9...;
          # only readings already present in v3-31-1 are protected.
          unzip -q -j _wanxiang/base-dicts.zip '*cuoyin.dict.yaml' -d _wanxiang
          sha256sum _wanxiang/cuoyin.dict.yaml

      - name: Build compact pack
        run: |
          set -euo pipefail
          # Only zh may be released from this repository.
          find Lexicons -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          python3 tools/compact_zh_pack.py \
            --cime _known_good/zh--zh.cime \
            --clex _known_good/zh--zh.clex \
            --max-readings "$MAX_READINGS" \
            --max-latin "$MAX_LATIN" \
            --target-rank "$TARGET_RANK" \
            --max-clex-words "$MAX_CLEX_WORDS" \
            --corrections _wanxiang/cuoyin.dict.yaml \
            --receipt compact-receipt.json
          python3 tools/validate-pack.py zh
          ls -l Lexicons

      - name: Enforce keyboard memory budget
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sizes = {p.name: p.stat().st_size for p in sorted(Path('Lexicons').iterdir())}
          total = sum(sizes.values())
          print(sizes, 'total', total)
          # v3-31-1 was 44.9 MB (20.4 MB CIME) and crashed the keyboard. The
          # largest official pack (mt) is ~13.5 MB; stay in that family.
          if set(sizes) != {'zh.cime', 'zh.clex', 'zh.cngm'}:
              raise SystemExit(f'unexpected assets: {sorted(sizes)}')
          if sizes['zh.cime'] > 7_000_000 or total > 10_000_000:
              raise SystemExit('Pack too large for the Clink keyboard; lower max_readings / max_latin.')

          # File size is not what iOS kills the extension for: resident memory is.
          # A Swift [String: [String]] costs ~64 B per row before any candidate,
          # so rows, candidates and CLEX words are the terms that matter here.
          # v5-z000002 measured ~38 MB this way and still froze intermittently.
          import struct
          rows = [l.split('\t') for l in Path('Lexicons/zh.cime').read_text(encoding='utf-8').splitlines()]
          cime = sum(64 + 16 * (len(f) - 1)
                     + sum(32 + len(x.encode()) for x in f if len(x.encode()) > 15)
                     for f in rows) * 1.4
          d = Path('Lexicons/zh.clex').read_bytes()
          count, alpha = struct.unpack_from('<II', d, 8)
          off = 16 + 4 * alpha + (alpha + 1) * alpha
          offs = struct.unpack_from(f'<{count + 1}I', d, off)
          wb = sum(16 + (32 + (offs[i + 1] - offs[i]) if offs[i + 1] - offs[i] > 15 else 0)
                   for i in range(count))
          clex = wb + 32 + (wb + count * 8) * 1.4
          g = Path('Lexicons/zh.cngm').read_bytes()
          pairs = struct.unpack_from('<I', g, 8)[0]
          groups = len(set(struct.unpack_from(f'<{pairs}I', g, 12)))
          cngm = (groups * 56 + pairs * 8) * 1.4
          resident = (cime + clex + cngm) / 1e6
          print(f'estimated resident: {resident:.1f} MB '
                f'(cime {cime/1e6:.1f} + clex {clex/1e6:.1f} + cngm {cngm/1e6:.1f}), '
                f'{len(rows):,} rows, {count:,} words, {pairs:,} pairs')
          # v5-z000002 measured 38.4 MB and froze intermittently; z000003/4 measured
          # 25.6 MB and did not. Stay clearly below the known-bad figure.
          if resident > 34:
              raise SystemExit(f'{resident:.1f} MB resident is too close to the iOS keyboard '
                               f'limit; lower max_readings, or set target_rank to spend '
                               f'a smaller budget on common words first.')

          # Fill the release notes from what actually shipped, so the published
          # description can never drift from the bytes it describes.
          import os
          notes = Path('.github/zh-v5-release-notes.md').read_text(encoding='utf-8')
          Path('release-notes.md').write_text(
              notes.format(pack_mb=f'{total/1e6:.2f}', resident_mb=f'{resident:.1f}',
                           rows=f'{len(rows):,}', words=f'{count:,}', pairs=f'{pairs:,}',
                           target_rank=os.environ['TARGET_RANK']),
              encoding='utf-8')
          PY

      - name: Create source receipt
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = {
              'profile': 'v5-compact',
              'derivedFromTag': 'vzh-wanxiang-v3-31-1',
              'note': 'Rows and candidate order are taken from v3-31-1 and only truncated; CNGM is rebuilt on the final CLEX IDs.',
              'compaction': json.loads(Path('compact-receipt.json').read_text(encoding='utf-8')),
              'correctionTables': {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                   for p in sorted(Path('_wanxiang').glob('*.dict.yaml'))},
              'knownGoodSourceReceipt': json.loads(Path('_known_good/wanxiang-source.json').read_text(encoding='utf-8')),
          }
          Path('wanxiang-source.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Build manifest containing only zh
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          python3 tools/build-release-manifest.py "$VERSION" "$GITHUB_REPOSITORY" out
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('out/manifest.json').read_text(encoding='utf-8'))
          assert [p['code'] for p in m['packs']] == ['zh'], m
          assets = {a['path'] for a in m['packs'][0]['assets']}
          assert assets == {'zh.cime', 'zh.clex', 'zh.cngm'}, assets
          print('Compact manifest verified:', m['version'], sorted(assets))
          PY

      - name: Publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Clink 中文万象 v5 compact — $VERSION" \
            --notes-file release-notes.md
          gh release upload "$VERSION" \
            out/assets/zh--zh.cime \
            out/assets/zh--zh.clex \
            out/assets/zh--zh.cngm \
            out/manifest.json \
            wanxiang-source.json
          gh release edit "$VERSION" --draft=false --latest

      - name: Verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-check"
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$VERSION" --dir "$RUNNER_TEMP/release-check"
          cmp out/manifest.json "$RUNNER_TEMP/release-check/manifest.json"
          cmp Lexicons/zh.cime "$RUNNER_TEMP/release-check/zh--zh.cime"
          cmp Lexicons/zh.clex "$RUNNER_TEMP/release-check/zh--zh.clex"
          cmp Lexicons/zh.cngm "$RUNNER_TEMP/release-check/zh--zh.cngm"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$VERSION"
          echo "Verified compact latest release: $latest"
