name: Diagnose compact jichu rank

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-compact-rank.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Wanxiang nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _wanxiang_release _wanxiang_dicts
          mkdir -p _wanxiang_release _wanxiang_dicts
          gh release download dict-nightly --repo amzxyz/rime-wanxiang --pattern base-dicts.zip --dir _wanxiang_release
          unzip -q _wanxiang_release/base-dicts.zip -d _wanxiang_dicts
      - name: Measure compact-only jichu rank
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from build_zh_wanxiang_v2 import parse_rime, normalize_pinyin, word_score

          jichu = next(Path('_wanxiang_dicts').rglob('jichu.dict.yaml'))
          scores = {}
          words = {}
          for word, raw_reading, weight, _ in parse_rime(jichu):
              if len(word) > 16:
                  continue
              syl = normalize_pinyin(raw_reading)
              if not syl:
                  continue
              key=''.join(syl)
              score=word_score(word, weight)
              if score > scores.get(key,-1):
                  scores[key]=score
              words.setdefault(key,[]).append((word,weight))

          ordered=sorted(scores,key=lambda k:(-scores[k],len(k),k))
          rank={k:i+1 for i,k in enumerate(ordered)}
          print('compact jichu keys:',len(ordered))
          for k in ('dihao','jilidihao','xindihau','xindihao'):
              print(k,'score=',scores.get(k),'rank=',rank.get(k),'cands=',sorted(words.get(k,[]),key=lambda x:-x[1])[:8])
          for budget in (300000,350000,400000,450000,500000,550000,600000):
              print('budget',budget,'keeps dihao?',rank.get('dihao',10**9)<=budget)
          PY
