name: Publish known-good Clink Chinese Wanxiang recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-zh-wanxiang-v4-stable.yml"

permissions:
  contents: write

concurrency:
  group: clink-zh-wanxiang-v4-stable
  cancel-in-progress: true

jobs:
  publish-known-good:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      KNOWN_GOOD_TAG: vzh-wanxiang-v3-31-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set lexically sortable release version
        run: |
          printf -v run "%06d" "$GITHUB_RUN_NUMBER"
          echo "VERSION=vzh-wanxiang-v4-z${run}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Restore exact known-good v3 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _known_good Lexicons/zh.cime Lexicons/zh.clex Lexicons/zh.cngm
          mkdir -p _known_good Lexicons

          gh release download "$KNOWN_GOOD_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'zh--zh.cime' \
            --pattern 'zh--zh.clex' \
            --pattern 'zh--zh.cngm' \
            --pattern 'wanxiang-source.json' \
            --dir _known_good

          cp _known_good/zh--zh.cime Lexicons/zh.cime
          cp _known_good/zh--zh.clex Lexicons/zh.clex
          cp _known_good/zh--zh.cngm Lexicons/zh.cngm

          echo "Known-good v3 assets restored byte-for-byte:"
          sha256sum Lexicons/zh.cime Lexicons/zh.clex Lexicons/zh.cngm
          ls -lh Lexicons/zh.cime Lexicons/zh.clex Lexicons/zh.cngm

      - name: Validate restored pack and known-good behavior
        run: |
          set -euo pipefail
          python3 tools/validate-pack.py zh
          python3 - <<'PY'
          from pathlib import Path

          rows = {}
          for raw in Path('Lexicons/zh.cime').read_text(encoding='utf-8').splitlines():
              fields = raw.split('\t')
              if len(fields) >= 2:
                  rows[fields[0]] = fields[1:]

          exact = {
              'pinyin':'拼音',
              'nihao':'你好',
              'dihao':'帝豪',
              'jilidihao':'吉利帝豪',
              'kjzl':'快捷指令',
              'smj':'什么价',
              'smjia':'什么价',
              'qujianma':'取件码',
              'xunihao':'虚拟号',
              'github':'GitHub',
              'appsrore':'App Store',
          }
          contains = {
              'bzd':'不知道',
              'wsm':'为什么',
              'zmhs':'怎么回事',
          }

          failed = []
          for key, want in exact.items():
              got = rows.get(key, [])
              print(key, '=>', ' / '.join(got[:8]) or 'MISSING')
              if not got or got[0] != want:
                  failed.append((key, want, got[:8]))
          for key, want in contains.items():
              got = rows.get(key, [])
              print(key, '=>', ' / '.join(got[:8]) or 'MISSING')
              if want not in got[:8]:
                  failed.append((key, want, got[:8]))

          if len(rows) < 600000:
              failed.append(('IME table unexpectedly small', len(rows)))
          if failed:
              raise SystemExit('Known-good recovery regression failure: ' + repr(failed))
          print('Known-good IME readings:', len(rows))
          PY

      - name: Create recovery source receipt
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('_known_good/wanxiang-source.json').read_text(encoding='utf-8'))
          receipt = {
              'profile': 'v4-recovery-known-good-v3',
              'recoveryFromTag': 'vzh-wanxiang-v3-31-1',
              'note': 'Assets are copied byte-for-byte from the user-verified known-good v3 release.',
              'knownGoodSourceReceipt': old,
          }
          Path('wanxiang-source.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Build manifest containing only restored zh
        run: |
          set -euo pipefail
          find Lexicons -mindepth 1 -maxdepth 1 \
            ! -name 'zh.clex' \
            ! -name 'zh.cime' \
            ! -name 'zh.cngm' \
            -exec rm -rf {} +

          rm -rf out
          mkdir -p out
          python3 tools/build-release-manifest.py "$VERSION" "$GITHUB_REPOSITORY" out

          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('out/manifest.json').read_text(encoding='utf-8'))
          assert [p['code'] for p in m['packs']] == ['zh'], m
          assets = {a['path'] for a in m['packs'][0]['assets']}
          assert assets == {'zh.cime','zh.clex','zh.cngm'}, assets
          print('Recovery manifest verified:', m['version'], sorted(assets))
          PY

      - name: Publish recovery as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Clink 中文万象 v4 recovery — $VERSION" \
            --notes "恢复用户已验证正常的 v3-31-1 三个语言资产，字节级不改动；只重新生成当前版本 manifest，排除 v4 构建参数造成的行为差异。"

          gh release upload "$VERSION" \
            out/assets/zh--zh.cime \
            out/assets/zh--zh.clex \
            out/assets/zh--zh.cngm \
            out/manifest.json \
            wanxiang-source.json

          gh release edit "$VERSION" --draft=false --latest

      - name: Verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-check"
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$VERSION" --dir "$RUNNER_TEMP/release-check"

          cmp out/manifest.json "$RUNNER_TEMP/release-check/manifest.json"
          cmp wanxiang-source.json "$RUNNER_TEMP/release-check/wanxiang-source.json"
          cmp Lexicons/zh.cime "$RUNNER_TEMP/release-check/zh--zh.cime"
          cmp Lexicons/zh.clex "$RUNNER_TEMP/release-check/zh--zh.clex"
          cmp Lexicons/zh.cngm "$RUNNER_TEMP/release-check/zh--zh.cngm"

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$VERSION"
          echo "Verified recovery latest release: $latest"
