name: Build and publish controlled zh IME probe

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "B = pin -> 榀; A = pin -> 拼. Record the previous device test before switching."
        type: choice
        options: [B, A]
        default: B
  push:
    branches: [main]
    paths:
      - "tools/zh_ime_probe.py"
      - "tools/test_zh_ime_probe.py"
      - ".github/workflows/build-zh-ime-fingerprint.yml"

permissions:
  contents: write

concurrency:
  group: clink-zh-ime-fingerprint
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VARIANT: ${{ inputs.variant || 'B' }}
      VERSION: vzh-ime-probe-${{ github.run_number }}-${{ github.run_attempt }}-${{ inputs.variant || 'B' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Offline regression tests
        run: python3 -m unittest discover -s tools -p test_zh_ime_probe.py -v
      - name: Build one zh pack and verify the A/B one-row difference
        run: |
          set -euo pipefail
          python3 tools/zh_ime_probe.py build \
            --stage "$RUNNER_TEMP/clink-zh-probe" \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --variant "$VARIANT"
      - name: Save reproducible build receipt (not a language asset)
        uses: actions/upload-artifact@v4
        with:
          name: zh-probe-build-receipt
          path: ${{ runner.temp }}/clink-zh-probe/verification.json
      - name: Publish exactly three zh assets plus manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/clink-zh-probe"
          gh release create "$VERSION" --target "$GITHUB_SHA" --draft \
            --title "Clink Community zh probe $VARIANT — $VERSION" \
            --notes-file FINGERPRINT_TEST.md
          gh release upload "$VERSION" \
            "$stage/out/assets/zh--zh.cime" \
            "$stage/out/assets/zh--zh.clex" \
            "$stage/out/assets/zh--zh.cngm" \
            "$stage/out/manifest.json"
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true
          gh release edit "$VERSION" --draft=false --latest
      - name: Re-download release and verify all discovery paths
        run: |
          set -euo pipefail
          python3 tools/zh_ime_probe.py verify-release \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --variant "$VARIANT" \
            --expected-manifest "$RUNNER_TEMP/clink-zh-probe/out/manifest.json"
