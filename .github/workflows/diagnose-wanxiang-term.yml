name: Diagnose Wanxiang term

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-wanxiang-term.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download current Wanxiang dict-nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _wanxiang_release _wanxiang_dicts
          mkdir -p _wanxiang_release _wanxiang_dicts
          gh release download dict-nightly \
            --repo amzxyz/rime-wanxiang \
            --pattern base-dicts.zip \
            --dir _wanxiang_release
          unzip -q _wanxiang_release/base-dicts.zip -d _wanxiang_dicts

      - name: Inspect 帝豪 in upstream dictionaries
        run: |
          set -euo pipefail
          echo "===== exact word 帝豪 ====="
          grep -RIn --include='*.dict.yaml' $'^帝豪\t' _wanxiang_dicts || true
          echo "===== substring 帝豪 ====="
          grep -RIn --include='*.dict.yaml' '帝豪' _wanxiang_dicts | head -50 || true

      - name: Build current Clink source and inspect dihao
        run: |
          set -euo pipefail
          python3 tools/build_zh_wanxiang_v3.py \
            --dict-root _wanxiang_dicts \
            --code zh \
            --out-dir source \
            --lexicon-limit 650000 \
            --max-ime-readings 500000 \
            --max-candidates 16 \
            --max-word-length 16 \
            --max-following 64 \
            --single-char-ime-min-weight 1 \
            --latin-terms source/zh-latin-terms.tsv \
            --custom-terms source/zh-domain-terms.tsv \
            --shortcut-terms source/zh-shortcuts.tsv \
            --english-limit 20000 \
            --english-typo-limit 2500 \
            --jianpin-limit 50000
          echo "===== generated dihao rows ====="
          grep -n $'^dihao\t' source/zh-ime.tsv || true
          grep -n $'^di hao\t' source/zh-ime.tsv || true
