name: Diagnose Wanxiang term

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-wanxiang-term.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download current Wanxiang dict-nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _wanxiang_release _wanxiang_dicts
          mkdir -p _wanxiang_release _wanxiang_dicts
          gh release download dict-nightly \
            --repo amzxyz/rime-wanxiang \
            --pattern base-dicts.zip \
            --dir _wanxiang_release
          unzip -q _wanxiang_release/base-dicts.zip -d _wanxiang_dicts

      - name: Inspect 帝豪 in upstream dictionaries
        run: |
          set -euo pipefail
          echo "===== exact word 帝豪 ====="
          grep -RIn --include='*.dict.yaml' $'^帝豪\t' _wanxiang_dicts || true
          echo "===== substring 帝豪 ====="
          grep -RIn --include='*.dict.yaml' '帝豪' _wanxiang_dicts | head -50 || true

      - name: Rank 帝豪 inside Wanxiang core jichu readings
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from build_zh_wanxiang_v2 import parse_rime, normalize_pinyin, word_score

          jichu = next(Path('_wanxiang_dicts').rglob('jichu.dict.yaml'))
          scores = {}
          for word, raw_reading, weight, _ in parse_rime(jichu):
              if len(word) > 16:
                  continue
              syllables = normalize_pinyin(raw_reading)
              if not syllables:
                  continue
              compact = ''.join(syllables)
              spaced = ' '.join(syllables)
              score = word_score(word, weight)
              for key in ({compact, spaced} if len(syllables) > 1 else {compact}):
                  scores[key] = max(scores.get(key, 0.0), score)

          ordered = sorted(scores, key=lambda k: (-scores[k], len(k), k))
          rank = {k:i+1 for i,k in enumerate(ordered)}
          print('jichu unique reading keys:', len(ordered))
          for key in ('dihao','di hao'):
              print(key, 'score=', scores.get(key), 'rank=', rank.get(key))
          for budget in (100000,150000,200000,250000,300000,350000):
              print('budget', budget, 'keeps dihao?', rank.get('dihao',10**9) <= budget, 'keeps di hao?', rank.get('di hao',10**9) <= budget)
          PY
